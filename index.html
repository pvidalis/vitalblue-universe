<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <link rel="shortcut icon" href="./favicon.ico" type="image/vnd.microsoft.icon"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>www.vitalblue.gr | still spinning around</title>
    <link type="text/css" rel="stylesheet" href="assets/css/solar-system.css" media="all"/>
    <link rel="stylesheet" href="assets/css/enhancements.css">
    <script src="assets/js/app.js" defer></script>
</head>
<body class="opening hide-UI view-2D zoom-large data-close controls-close">
<header id="navbar">
    <a id="toggle-data" href="#data" aria-controls="data" aria-expanded="false"><i class="icon-data"></i>Data</a>
    <h1>vitalblue.gr<br><span>still spinning around</span></h1>
    <a id="toggle-controls" href="#controls" aria-controls="controls" aria-expanded="false"><i class="icon-controls"></i>Controls</a>
</header>
<nav id="data" aria-label="Select a celestial body">
    <a class="sun" title="sun" href="#sunspeed">Sun</a>
    <a class="mercury" title="mercury" href="#mercuryspeed">Mercury</a>
    <a class="venus" title="venus" href="#venusspeed">Venus</a>
    <a class="earth active" aria-current="true" title="earth" href="#earthspeed">Earth</a>
    <a class="mars" title="mars" href="#marsspeed">Mars</a>
    <a class="jupiter" title="jupiter" href="#jupiterspeed">Jupiter</a>
    <a class="saturn" title="saturn" href="#saturnspeed">Saturn</a>
    <a class="uranus" title="uranus" href="#uranusspeed">Uranus</a>
    <a class="neptune" title="neptune" href="#neptunespeed">Neptune</a>
</nav>
<section id="controls" aria-label="Display controls">
    <label class="set-view">
        <input type="checkbox" aria-label="Toggle 2D view">
    </label>
    <label class="set-zoom">
        <input type="checkbox" aria-label="Toggle close zoom">
    </label>
    <label>
        <input type="radio" class="set-speed" name="scale" checked>
        <span>Speed</span>
    </label>
    <label>
        <input type="radio" class="set-size" name="scale">
        <span>Size</span>
    </label>
    <label>
        <input type="radio" class="set-distance" name="scale">
        <span>Distance</span>
    </label>
</section>
<div id="universe" class="scale-stretched set-speed">
    <div id="galaxy">
        <div id="solar-system" class="earth">
            <div id="mercury" class="orbit">
                <div class="pos">
                    <div class="planet">
                        <dl class="infos">
                            <dt>Mercury</dt>
                            <dd><span></span></dd>
                        </dl>
                    </div>
                </div>
            </div>
            <div id="venus" class="orbit">
                <div class="pos">
                    <div class="planet">
                        <dl class="infos">
                            <dt>Venus</dt>
                            <dd><span></span></dd>
                        </dl>
                    </div>
                </div>
            </div>
            <div id="earth" class="orbit">
                <div class="pos">
                    <div class="orbit">
                        <div class="pos">
                            <div class="moon"></div>
                        </div>
                    </div>
                    <div class="planet">
                        <dl class="infos">
                            <dt>Earth</dt>
                            <dd><span></span></dd>
                        </dl>
                    </div>
                </div>
            </div>
            <div id="mars" class="orbit">
                <div class="pos">
                    <div class="planet">
                        <dl class="infos">
                            <dt>Mars</dt>
                            <dd><span></span></dd>
                        </dl>
                    </div>
                </div>
            </div>
            <div id="jupiter" class="orbit">
                <div class="pos">
                    <div class="planet">
                        <dl class="infos">
                            <dt>Jupiter</dt>
                            <dd><span></span></dd>
                        </dl>
                    </div>
                </div>
            </div>
            <div id="saturn" class="orbit">
                <div class="pos">
                    <div class="planet">
                        <div class="ring"></div>
                        <dl class="infos">
                            <dt>Saturn</dt>
                            <dd><span></span></dd>
                        </dl>
                    </div>
                </div>
            </div>
            <div id="uranus" class="orbit">
                <div class="pos">
                    <div class="planet">
                        <dl class="infos">
                            <dt>Uranus</dt>
                            <dd><span></span></dd>
                        </dl>
                    </div>
                </div>
            </div>
            <div id="neptune" class="orbit">
                <div class="pos">
                    <div class="planet">
                        <dl class="infos">
                            <dt>Neptune</dt>
                            <dd><span></span></dd>
                        </dl>
                    </div>
                </div>
            </div>
            <div id="sun">
                <dl class="infos">
                    <dt>Sun</dt>
                    <dd><span></span></dd>
                </dl>
            </div>
        </div>
    </div>
</div>
</body>
</html>
